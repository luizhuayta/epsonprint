name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test:
    name: Rust y instalador (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libclang-dev libegl1 libgl1 mesa-vulkan-drivers fonts-dejavu-core desktop-file-utils

      - name: Entorno headless
        run: |
          install -d -m 700 "$RUNNER_TEMP/printdesk-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/printdesk-runtime" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formato
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Pruebas
        run: cargo test --locked

      - name: Compilación release
        run: cargo build --release --locked

      - name: Instalador aislado (sin root ni hardware)
        run: bash tests/instalador.bash
