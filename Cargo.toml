[package]
name = "printdesk"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
exprim = { version = "0.4.0", features = ["print"] }
iced = { version = "0.14.0", features = ["advanced", "image", "svg"] }
image = "0.25.10"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[dev-dependencies]
tempfile = "3.27.0"
