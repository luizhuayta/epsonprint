[package]
name = "printdesk"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Aplicación de escritorio Linux para imprimir y escanear con CUPS y SANE"
license = "MIT"
repository = "https://github.com/luizhuayta/epsonprint"
readme = "README.md"

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
exprim = { version = "=0.4.0", features = ["print"] }
iced = { version = "=0.14.0", features = ["advanced", "image", "svg"] }
image = "0.25.10"
printpdf = { version = "=0.12.9", default-features = false, features = ["images"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[dev-dependencies]
iced_test = "=0.14.0"
